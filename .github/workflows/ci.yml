name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm cv:check
      - run: pnpm build
      - run: pnpm test:smoke
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm cv:test
      - run: pnpm cv:generate
      - run: pnpm cv:check
      - run: pnpm test:browser
      - name: Build with an example origin for launch audits (no deployment)
        run: pnpm build
        env:
          SITE_URL: https://portfolio.example
          SITE_INDEXABLE: "true"
      - name: Verify configured SEO in production HTML
        run: pnpm test:browser seo.spec.ts --project=chromium
        env:
          SITE_URL: https://portfolio.example
          SITE_INDEXABLE: "true"
      - run: pnpm test:lighthouse
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: design-review
          path: |
            docs/design-review/*.png
            docs/cv-review/*.pdf
            public/cv/*.pdf
            test-results/
            quality-results/
