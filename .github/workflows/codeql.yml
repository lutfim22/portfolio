# Adapted from actions/starter-workflows/code-scanning/codeql.yml.
# Owner must switch CodeQL from default to advanced setup before results upload.
name: CodeQL Advanced

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 4"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: +security-extended
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4.39.1
        with:
          category: /language:${{ matrix.language }}
          output: codeql-results
      - name: Retain analysis results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: codeql-${{ matrix.language }}
          path: codeql-results/*.sarif
          if-no-files-found: ignore
          retention-days: 7
